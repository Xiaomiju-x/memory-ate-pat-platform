<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Memory ATE PAT Platform</title>
  <desc id="desc">Project banner showing AT24C02 I2C, BY25Q40AL SPI and national-finals multi-device pattern generation, plus First Prize awards in the Southwest regional stage and National Finals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1930"/>
      <stop offset="1" stop-color="#10264a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8bb7e6" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="42" r="220" fill="#2563eb" opacity=".08"/>
  <circle cx="915" cy="350" r="180" fill="#14b8a6" opacity=".06"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="80" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="3">OPEN-SOURCE SEMICONDUCTOR TEST ENGINEERING</text>
    <text x="60" y="149" fill="#f8fafc" font-size="54" font-weight="800" letter-spacing="-1">MEMORY ATE</text>
    <text x="60" y="207" fill="url(#cyan)" font-size="54" font-weight="800" letter-spacing="-1">PAT PLATFORM</text>
    <text x="64" y="249" fill="#b8c7db" font-size="20">AT24C02 · I²C EEPROM  /  BY25Q40AL · SPI NOR Flash</text>

    <g transform="translate(64 277)">
      <rect width="460" height="42" rx="21" fill="#7f1d1d" stroke="#fca5a5" stroke-opacity=".45"/>
      <circle cx="23" cy="21" r="8" fill="#fbbf24"/>
      <text x="43" y="27" fill="#fff7ed" font-size="16" font-weight="700">西南赛区一等奖 · 全国总决赛一等奖</text>
    </g>

    <g transform="translate(64 344)" font-size="14" font-weight="650">
      <text x="0" y="0" fill="#6ee7b7">● 初赛平台 · 已完成</text>
      <text x="185" y="0" fill="#6ee7b7">● 复赛平台 · 已完成</text>
      <text x="370" y="0" fill="#fbbf24">● 全国一等奖 · 软件已开源</text>
    </g>
  </g>

  <g transform="translate(735 26)">
    <rect x="98" y="62" width="240" height="178" rx="20" fill="#0b1424" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <rect x="119" y="83" width="198" height="136" rx="12" fill="#101f37" stroke="#5da4df" stroke-opacity=".55"/>
    <g stroke="#38bdf8" stroke-width="7" stroke-linecap="round">
      <path d="M98 88H62M98 124H62M98 160H62M98 196H62"/>
      <path d="M338 88H374M338 124H374M338 160H374M338 196H374"/>
    </g>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
      <text x="218" y="128" fill="#e0f2fe" font-size="21" font-weight="800">MEMORY DUT</text>
      <text x="218" y="160" fill="#7dd3fc" font-size="15">I²C · SPI · DUAL · QUAD</text>
      <text x="218" y="192" fill="#94a3b8" font-size="13">GENERATE · VALIDATE · EXPORT</text>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 284h40v-28h44v28h44v-28h44v28h44v-28h44v28h44" stroke="#38bdf8" stroke-width="4"/>
      <path d="M28 332h62v-28h66v28h66v-28h70" stroke="#2dd4bf" stroke-width="4"/>
      <path d="M28 368h88l18-18 18 36 18-36 18 18h104" stroke="#fbbf24" stroke-width="3"/>
    </g>
    <g font-family="Consolas, monospace" font-size="13" font-weight="700">
      <text x="-6" y="288" fill="#7dd3fc">CLK</text>
      <text x="-6" y="336" fill="#5eead4">DATA</text>
      <text x="-6" y="372" fill="#fbbf24">PAT</text>
    </g>
  </g>

  <path d="M22 414H1178" stroke="url(#cyan)" stroke-width="2" opacity=".55"/>
</svg>
